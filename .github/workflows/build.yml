name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project Archive
      run: |
        if [ -f "MonitorApp.zip" ]; then
          unzip MonitorApp.zip -d extracted_project
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build with Gradle
      run: |
        # البحث عن مجلد المشروع الذي يحتوي على gradlew
        GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, searching for build.gradle..."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk

