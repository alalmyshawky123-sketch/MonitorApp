name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: List Repository Contents
      run: ls -la

    - name: Unzip Archive if exists
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          unzip *.zip -d extracted_files
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate and Build APK
      run: |
        find . -name "gradlew" -exec chmod +x {} +
        GRADLEW_FILE=$(find . -name "gradlew" -print -quit)
        if [ -n "$GRADLEW_FILE" ]; then
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "Building from directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug
        else
          echo "Error: gradlew not found anywhere in the repository."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
